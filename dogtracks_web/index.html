<!DOCTYPE html>
<!-- Standard HTML5 document declaration -->
<html lang="en">
  <!-- Document head containing metadata and stylesheets -->
  <head>
    <!-- Character set definition -->
    <meta charset="UTF-8" />
    <!-- Responsive layout viewport settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser window title -->
    <title>DogTracks — Dog Training Journal</title>
    <!-- Stylesheet located in root folder -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <!-- Document body -->
  <body>
    <!-- Top-level navigation bar matching topbar styles -->
    <header class="app-header topbar">
      <!-- Brand emblem and title -->
      <div class="brand">
        <!-- Visual monogram badge -->
        <span class="brand-mark" aria-hidden="true">D</span>
        <!-- Application title text -->
        <span class="brand-name">DogTracks</span>
      </div>
      <!-- Top bar action buttons -->
      <div class="topbar-actions">
        <!-- Add Dog modal trigger button (hidden when logged out) -->
        <button type="button" id="open-dog-dialog" class="button button-primary" style="display: none; flex-direction: column; justify-content: center;"">
          + Add Dog
        </button>
        <!-- Auth button: triggers authentication modal or logs out -->
        <button type="button" id="auth-btn" class="button button-quiet" style="display: flex; flex-direction: column; justify-content: center;">
          Sign In
        </button>
      </div>
    </header>

    <!-- Main landmark shell -->
    <main class="page-shell">
      <!-- Dynamic render mount point -->
      <div id="app">
        <!-- Initial placeholder before app.js renders -->
        <p class="loading-state">Loading DogTracks...</p>
      </div>
    </main>

    <!-- AUTHENTICATION (LOGIN & SIGN UP) MODAL DIALOG -->
    <dialog id="auth-dialog" class="dialog dog-dialog" aria-labelledby="auth-modal-title">
      <!-- Inner modal card frame -->
      <div class="dialog-card">
        <!-- Dialog top header -->
        <div class="dialog-header dialog-heading">
          <!-- Accessible dialog title -->
          <h2 id="auth-modal-title">Account Access</h2>
          <!-- Dismiss button -->
          <button type="button" class="icon-button" data-close-auth aria-label="Close dialog">
            &times;
          </button>
        </div>

        <!-- Tab switcher to alternate between Login and Sign Up -->
        <div class="auth-tabs" style="display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px;">
          <!-- Tab button for Login -->
          <button type="button" id="tab-login-btn" class="button button-primary" style="flex: 1; min-height: 34px; font-size: 12px;">
            Log In
          </button>
          <!-- Tab button for Sign Up -->
          <button type="button" id="tab-signup-btn" class="button button-quiet" style="flex: 1; min-height: 34px; font-size: 12px;">
            Sign Up
          </button>
        </div>

        <!-- 1. LOGIN FORM (Visible by default) -->
        <form id="login-form" class="dialog-form" method="dialog">
          <!-- Email field -->
          <label>
            Email Address
            <input type="email" id="login-email" required placeholder="user@example.com" />
          </label>

          <!-- Password field -->
          <label>
            Password
            <input type="password" id="login-password" required placeholder="••••••••" />
          </label>

          <!-- Action buttons -->
          <div class="dialog-actions">
            <button type="button" class="button button-secondary" data-close-auth>
              Cancel
            </button>
            <button type="submit" class="button button-primary">
              Log In
            </button>
          </div>
        </form>

        <!-- 2. SIGN UP FORM (Hidden by default, matches Users collection schema) -->
        <form id="signup-form" class="dialog-form" method="dialog" style="display: none;">
          <!-- User Name field -->
          <label>
            Full Name
            <input type="text" id="signup-name" required placeholder="e.g. Bob" />
          </label>

          <!-- User Email field -->
          <label>
            Email Address
            <input type="email" id="signup-email" required placeholder="dude123@gmail.com" />
          </label>

          <!-- User Password field -->
          <label>
            Password
            <input type="password" id="signup-password" required minlength="6" placeholder="Choose a secure password" />
          </label>

          <!-- Location coordinates for the GeoPoint Address field -->
          <div class="form-row">
            <label>
              Latitude
              <input type="number" step="any" id="signup-lat" required value="47.996753" placeholder="e.g. 47.996753" />
            </label>
            <label>
              Longitude
              <input type="number" step="any" id="signup-lng" required value="-102.563571" placeholder="e.g. -102.563571" />
            </label>
          </div>

          <!-- Action buttons -->
          <div class="dialog-actions">
            <button type="button" class="button button-secondary" data-close-auth>
              Cancel
            </button>
            <button type="submit" class="button button-primary">
              Create Account
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- ADD DOG MODAL DIALOG -->
    <dialog id="dog-dialog" class="dialog dog-dialog" aria-labelledby="dialog-title">
      <!-- Card frame -->
      <div class="dialog-card">
        <!-- Dialog header -->
        <div class="dialog-header dialog-heading">
          <h2 id="dialog-title">Add a dog profile</h2>
          <button type="button" class="icon-button" data-close-dialog aria-label="Close dialog">
            &times;
          </button>
        </div>

        <!-- Form to add new dog document -->
        <form id="dog-form" class="dialog-form" method="dialog">
          <label>
            Dog's Name
            <input type="text" name="Name" required maxlength="50" placeholder="e.g. Bailey" />
          </label>

          <label>
            Breed
            <input type="text" name="Breed" maxlength="50" placeholder="e.g. Labrador Retriever" />
          </label>

          <label>
            Date of Birth
            <input type="date" name="DateOfBirth" required />
          </label>

          <label>
            Profile Notes
            <textarea name="Notes" maxlength="300" placeholder="Favorite cues, triggers, or personality traits..."></textarea>
          </label>

          <div class="dialog-actions">
            <button type="button" class="button button-secondary" data-close-dialog>
              Cancel
            </button>
            <button type="submit" class="button button-primary">
              Save Dog Profile
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- Correct relative path to app.js inside src/ -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
