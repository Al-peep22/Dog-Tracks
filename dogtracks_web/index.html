<!DOCTYPE html>
<!-- Standard HTML5 document declaration -->
<html lang="en">
  <!-- Document head containing metadata and stylesheets -->
  <head>
    <!-- Character set definition -->
    <meta charset="UTF-8" />
    <!-- Responsive layout viewport settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser window title -->
    <title>DogTracks — Dog Training Journal</title>
    <!-- Stylesheet located in root folder -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <!-- Document body -->
  <body>
    <!-- Top-level navigation bar matching topbar styles -->
    <header class="app-header topbar">
      <!-- Brand emblem and title -->
      <div class="brand">
        <!-- Visual monogram badge -->
        <span class="brand-mark" aria-hidden="true">D</span>
        <!-- Application title text -->
        <span class="brand-name">DogTracks</span>
      </div>
      <!-- Top bar action buttons -->
      <div class="topbar-actions">
        <!-- Add Dog modal trigger button (hidden when logged out) -->
        <button type="button" id="open-dog-dialog" class="button button-primary" style="display: none; flex-direction: column; justify-content: center;">
          + Add Dog
        </button>
        <!-- Auth button: triggers login screen or logs user out -->
        <button type="button" id="auth-btn" class="button button-quiet" style="display: flex; flex-direction: column; justify-content: center;">
          Sign In
        </button>
      </div>
    </header>

    <!-- Main landmark shell -->
    <main class="page-shell">
      <!-- Dynamic render mount point for Login page and Dashboard -->
      <div id="app">
        <!-- Initial placeholder before app.js renders -->
        <p class="loading-state">Loading DogTracks...</p>
      </div>
    </main>

    <!-- ADD DOG MODAL DIALOG -->
    <dialog id="dog-dialog" class="dialog dog-dialog" aria-labelledby="dialog-title">
      <!-- Card frame -->
      <div class="dialog-card">
        <!-- Dialog header -->
        <div class="dialog-header dialog-heading">
          <h2 id="dialog-title">Add a dog profile</h2>
          <button type="button" class="icon-button" data-close-dialog aria-label="Close dialog">
            &times;
          </button>
        </div>

        <!-- Form to add new dog document -->
        <form id="dog-form" class="dialog-form" method="dialog">
          <!-- Dog Name input field matching schema 'Name' -->
          <label>
            Dog's Name
            <input type="text" name="Name" required maxlength="50" placeholder="e.g. Bailey" />
          </label>

          <!-- Dog Breed input field matching schema 'Breed' -->
          <label>
            Breed
            <input type="text" name="Breed" maxlength="50" placeholder="e.g. Labrador Retriever" />
          </label>

          <!-- Two-column row for Color and Profile Photo -->
          <div class="form-row">
            <!-- Hex Color Picker input field matching schema 'Color' -->
            <label>
              Profile Theme Color
              <input type="color" name="Color" value="#315f4e" style="height: 39px; padding: 2px 4px; cursor: pointer;" />
            </label>

            <!-- File Upload Input converted to string data URL matching schema 'PhotoDataUrl' -->
            <label>
              Profile Photo
              <input type="file" name="PhotoFile" accept="image/*" style="font-size: 11px; padding: 6px 8px;" />
            </label>
          </div>

          <!-- Dog Date of Birth input field locked to today max to prevent future dates -->
          <label>
            Date of Birth
            <input type="date" name="DateOfBirth" id="dog-dob-input" required />
          </label>

          <!-- Dog Profile Notes textarea matching schema 'Notes' -->
          <label>
            Profile Notes
            <textarea name="Notes" maxlength="300" placeholder="Favorite cues, triggers, or personality traits..."></textarea>
          </label>

          <div class="dialog-actions">
            <button type="button" class="button button-secondary" data-close-dialog>
              Cancel
            </button>
            <button type="submit" class="button button-primary">
              Save Dog Profile
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- ACCOUNT DELETION CONFIRMATION DIALOG -->
    <dialog id="delete-account-dialog" class="dialog dog-dialog" aria-labelledby="delete-account-title">
      <div class="dialog-card">
        <div class="dialog-header dialog-heading">
          <h2 id="delete-account-title" style="color: #b73a3a;">Delete Account</h2>
          <button type="button" class="icon-button" data-close-delete-account aria-label="Close dialog">&times;</button>
        </div>
        <div style="padding: 16px 0;">
          <p style="margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: #2d3748;">
            This will permanently delete your user profile, all registered dogs, and all training records. <strong>This action cannot be undone.</strong>
          </p>
          <label style="display: block; font-size: 12px; margin-bottom: 6px;">
            Type <strong>DELETE</strong> below to confirm:
            <input type="text" id="delete-account-confirm-input" placeholder="DELETE" autocomplete="off" style="margin-top: 6px; width: 100%;" />
          </label>
        </div>
        <div class="dialog-actions">
          <button type="button" class="button button-secondary" data-close-delete-account>Cancel</button>
          <button type="button" id="confirm-delete-account-btn" class="button" style="background: #b73a3a; color: #fff;">Permanently Delete</button>
        </div>
      </div>
    </dialog>

    <!-- Correct relative path to app.js inside src/ -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
