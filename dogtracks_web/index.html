<!doctype html>
<html lang="en">
  <head>
    <!-- Sets the character encoding so the browser knows how to read text -->
    <meta charset="utf-8">

    <!-- Makes the layout responsive on phones, tablets, and desktops -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Sets the browser theme color (used on mobile browser UI bars) -->
    <meta name="theme-color" content="#f7f7f2">

    <!-- Short description for search engines and link previews -->
    <meta name="description" content="A simple place to track dog training and behavior progress.">

    <!-- Title shown in the browser tab -->
    <title>DogTracks | Training journal</title>

    <!-- Links your CSS file that controls all styling -->
    <link rel="stylesheet" href="styles.css">

    <!-- Loads your main JavaScript file as a module (modern JS) -->
    <script type="module" src="src/app.js"></script>
  </head>

  <body>
    <!-- Top navigation bar -->
    <header class="topbar">
      <!-- Brand/logo link that returns user to the home screen -->
      <a class="brand" href="#home" aria-label="DogTracks home">
        <!-- Decorative brand mark (the letter D) -->
        <span class="brand-mark" aria-hidden="true">D</span>
        <!-- Visible brand name -->
        <span>DogTracks</span>
      </a>

      <!-- Right side of the top bar: status + add dog button -->
      <div class="topbar-actions">
        <!-- Shows that data is saved locally on the device -->
        <span class="local-badge">
          <span aria-hidden="true"></span> Saved on this device
        </span>

        <!-- Button that opens the "Add Dog" dialog -->
        <button class="button button-primary" id="open-dog-dialog" type="button">
          Add a dog <span aria-hidden="true">+</span>
        </button>
      </div>
    </header>

    <!-- Main application container where JS will render pages -->
    <main id="app" class="page-shell" aria-live="polite">
      <!-- Temporary loading message until JS loads the journal -->
      <p class="loading">Loading your training journal…</p>
    </main>

    <!-- Dialog popup for adding a new dog profile -->
    <dialog id="dog-dialog" class="dialog" aria-labelledby="dog-dialog-title">
      <!-- Form inside the dialog -->
      <form id="dog-form" class="dialog-card">

        <!-- Header section of the dialog -->
        <div class="dialog-heading">
          <div>
            <!-- Small label above the title -->
            <p class="eyebrow">DOG PROFILE</p>

            <!-- Dialog title -->
            <h2 id="dog-dialog-title">Add a dog</h2>
          </div>

          <!-- Close button for the dialog -->
          <button class="icon-button" type="button" data-close-dialog aria-label="Close">×</button>
        </div>

        <!-- Dog name input -->
        <label>
          Name
          <input name="name" required maxlength="60" autocomplete="off" placeholder="e.g. Bailey">
        </label>

        <!-- Breed + Age inputs side-by-side -->
        <div class="form-row">
          <label>
            Breed
            <input name="breed" maxlength="80" placeholder="e.g. Labrador mix">
          </label>

          <label>
            Age in years
            <input name="ageYears" type="number" min="0" max="40" step="1" value="1">
          </label>
        </div>

        <!-- Notes textarea -->
        <label>
          Notes
          <textarea name="notes" rows="3" maxlength="500" placeholder="Anything helpful to remember"></textarea>
        </label>

        <!-- Buttons at the bottom of the dialog -->
        <div class="dialog-actions">
          <!-- Cancel button closes the dialog without saving -->
          <button class="button button-quiet" type="button" data-close-dialog>Cancel</button>

          <!-- Submit button saves the dog profile -->
          <button class="button button-primary" type="submit">Save profile</button>
        </div>

      </form>
    </dialog>
  </body>
</html>
