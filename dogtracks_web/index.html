<!DOCTYPE html>
<!-- Declare standard HTML5 document type -->
<html lang="en">
  <!-- Head section containing metadata, links, and viewport settings -->
  <head>
    <!-- Set character encoding to standard UTF-8 -->
    <meta charset="UTF-8" />
    <!-- Ensure responsive viewport scaling on mobile and desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser window title -->
    <title>DogTracks — Dog Training Journal</title>
    <!-- Correctly point to styles.css located in the same root folder -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <!-- Document body containing structural markup -->
  <body>
    <!-- Top-level navigation bar matching topbar styles -->
    <header class="app-header topbar">
      <!-- Brand logo and emblem wrapper -->
      <div class="brand">
        <!-- Visual brand icon mark -->
        <span class="brand-mark" aria-hidden="true">D</span>
        <!-- Application brand name -->
        <span class="brand-name">DogTracks</span>
      </div>
      <!-- Actions area in top bar -->
      <div class="topbar-actions">
        <!-- Button targeted by document.querySelector('#open-dog-dialog') in src/app.js -->
        <button type="button" id="open-dog-dialog" class="button button-primary">
          <!-- Button text -->
          + Add Dog
        </button>
      </div>
    </header>

    <!-- Main landmark container centered by page-shell CSS rules -->
    <main class="page-shell">
      <!-- Main dynamic mount root targeted by document.querySelector('#app') in src/app.js -->
      <div id="app">
        <!-- Placeholder text shown only before app.js renders -->
        <p class="loading-state">Loading your training journal...</p>
      </div>
    </main>

    <!-- Native modal dialog targeted by document.querySelector('#dog-dialog') in src/app.js -->
    <dialog id="dog-dialog" class="dialog dog-dialog" aria-labelledby="dialog-title">
      <!-- Inner modal card frame -->
      <div class="dialog-card">
        <!-- Header containing modal title and dismiss icon -->
        <div class="dialog-header dialog-heading">
          <!-- Accessible dialog title -->
          <h2 id="dialog-title">Add a dog profile</h2>
          <!-- Close button targeted by closeDialogButtons in src/app.js -->
          <button type="button" class="icon-button" data-close-dialog aria-label="Close dialog">
            <!-- Close cross symbol -->
            &times;
          </button>
        </div>

        <!-- HTML Form targeted by document.querySelector('#dog-form') in src/app.js -->
        <form id="dog-form" class="dialog-form" method="dialog">
          <!-- Dog Name input field matching schema 'Name' -->
          <label>
            <!-- Field title text -->
            Dog's Name
            <!-- Text input for Name -->
            <input type="text" name="Name" required maxlength="50" placeholder="e.g. Bailey" />
          </label>

          <!-- Dog Breed input field matching schema 'Breed' -->
          <label>
            <!-- Field title text -->
            Breed
            <!-- Text input for Breed -->
            <input type="text" name="Breed" maxlength="50" placeholder="e.g. Labrador Retriever" />
          </label>

          <!-- Dog DateOfBirth input field matching schema 'DateOfBirth' -->
          <label>
            <!-- Field title text -->
            Date of Birth
            <!-- Date picker input for DateOfBirth -->
            <input type="date" name="DateOfBirth" required />
          </label>

          <!-- Dog Notes textarea matching schema 'Notes' -->
          <label>
            <!-- Field title text -->
            Profile Notes
            <!-- Textarea for Notes -->
            <textarea name="Notes" maxlength="300" placeholder="Favorite cues, triggers, or personality traits..."></textarea>
          </label>

          <!-- Action buttons row -->
          <div class="dialog-actions">
            <!-- Cancel button marked with data-close-dialog -->
            <button type="button" class="button button-secondary" data-close-dialog>
              <!-- Button label -->
              Cancel
            </button>
            <!-- Submit button triggering dogForm event listener in src/app.js -->
            <button type="submit" class="button button-primary">
              <!-- Button label -->
              Save Dog Profile
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- Correct relative path to app.js inside the src/ folder -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
