<!DOCTYPE html>
<!-- Standard HTML5 document declaration -->
<html lang="en">
  <!-- Document head containing metadata and stylesheets -->
  <head>
    <!-- Character set definition -->
    <meta charset="UTF-8" />
    <!-- Responsive layout viewport settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser window title -->
    <title>DogTracks — Dog Training Journal</title>
    <!-- Stylesheet located in root dogtracks_web folder -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <!-- Document body -->
  <body>
    <!-- Top-level navigation bar -->
    <header class="app-header topbar">
      <!-- Brand emblem and title -->
      <div class="brand">
        <!-- Visual monogram badge -->
        <span class="brand-mark" aria-hidden="true">D</span>
        <!-- Application title text -->
        <span class="brand-name">DogTracks</span>
      </div>
      <!-- Top bar action buttons -->
      <div class="topbar-actions">
        <!-- Add Dog modal trigger button (hidden when logged out) -->
        <button type="button" id="open-dog-dialog" class="button button-primary" style="display: none; flex-direction: column; justify-content: center;">
          + Add Dog
        </button>
        <!-- Auth toggle button: triggers login modal or logs out -->
        <button type="button" id="auth-btn" class="button button-quiet" style="display: flex; flex-direction: column; justify-content: center;">
          Admin Login
        </button>
      </div>
    </header>

    <!-- Main landmark shell -->
    <main class="page-shell">
      <!-- Dynamic render mount point -->
      <div id="app">
        <!-- Initial prompt encouraging admin to sign in -->
        <p class="loading-state">Please log in as Admin to access DogTracks.</p>
      </div>
    </main>

    <!-- ADMIN LOGIN MODAL DIALOG -->
    <dialog id="login-dialog" class="dialog dog-dialog" aria-labelledby="login-title">
      <!-- Inner modal card frame -->
      <div class="dialog-card">
        <!-- Dialog top header -->
        <div class="dialog-header dialog-heading">
          <!-- Accessible dialog title -->
          <h2 id="login-title">Admin Sign In</h2>
          <!-- Dismiss button -->
          <button type="button" class="icon-button" data-close-login aria-label="Close dialog">
            &times;
          </button>
        </div>

        <!-- Form targeted by app.js for Firebase Authentication -->
        <form id="login-form" class="dialog-form" method="dialog">
          <!-- Email field -->
          <label>
            Admin Email
            <input type="email" id="login-email" required placeholder="admin@dogtracks.com" />
          </label>

          <!-- Password field -->
          <label>
            Password
            <input type="password" id="login-password" required placeholder="••••••••" />
          </label>

          <!-- Action buttons -->
          <div class="dialog-actions">
            <button type="button" class="button button-secondary" data-close-login>
              Cancel
            </button>
            <button type="submit" class="button button-primary">
              Log In
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- ADD DOG MODAL DIALOG -->
    <dialog id="dog-dialog" class="dialog dog-dialog" aria-labelledby="dialog-title">
      <!-- Card frame -->
      <div class="dialog-card">
        <!-- Dialog header -->
        <div class="dialog-header dialog-heading">
          <h2 id="dialog-title">Add a dog profile</h2>
          <button type="button" class="icon-button" data-close-dialog aria-label="Close dialog">
            &times;
          </button>
        </div>

        <!-- Form to add new dog document -->
        <form id="dog-form" class="dialog-form" method="dialog">
          <label>
            Dog's Name
            <input type="text" name="Name" required maxlength="50" placeholder="e.g. Bailey" />
          </label>

          <label>
            Breed
            <input type="text" name="Breed" maxlength="50" placeholder="e.g. Labrador Retriever" />
          </label>

          <label>
            Date of Birth
            <input type="date" name="DateOfBirth" required />
          </label>

          <label>
            Profile Notes
            <textarea name="Notes" maxlength="300" placeholder="Favorite cues, triggers, or personality traits..."></textarea>
          </label>

          <div class="dialog-actions">
            <button type="button" class="button button-secondary" data-close-dialog>
              Cancel
            </button>
            <button type="submit" class="button button-primary">
              Save Dog Profile
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- Path to app.js inside src/ folder -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
